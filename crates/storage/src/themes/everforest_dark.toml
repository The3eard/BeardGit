# Everforest Dark (medium contrast).
# ANSI palette from mbadolato/iTerm2-Color-Schemes (alacritty), the
# canonical 16-colour rendering of the upstream palette.

[meta]
id = "everforest-dark"
name = "Everforest Dark"
mode = "dark"
complementary = "everforest-light"

[colors]
background = "#232a2e"
foreground = "#d3c6aa"
black = "#7a8478"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#f2efdf"
bright-black = "#a6b0a0"
bright-red = "#f85552"
bright-green = "#8da101"
bright-yellow = "#dfa000"
bright-blue = "#3a94c5"
bright-magenta = "#df69ba"
bright-cyan = "#35a77c"
bright-white = "#fffbef"

[accents]
primary = "green"
secondary = "blue"
tertiary = "yellow"
