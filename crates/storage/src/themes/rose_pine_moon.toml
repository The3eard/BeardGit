# Rosé Pine Moon.
#
# ANSI mapping note: Rosé Pine has no green and no cyan. Its palette is
# love/gold/rose/pine/foam/iris, and upstream maps `green` to `pine` (a
# teal) and `cyan` to `rose` (a pink). Kept faithful rather than
# substituted, so success and added-line states read teal here by design.

[meta]
id = "rose-pine-moon"
name = "Rosé Pine Moon"
mode = "dark"
complementary = "rose-pine-dawn"

[colors]
background = "#232136"
foreground = "#e0def4"
black = "#393552"
red = "#eb6f92"
green = "#3e8fb0"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ea9a97"
white = "#e0def4"
bright-black = "#6e6a86"
bright-red = "#eb6f92"
bright-green = "#3e8fb0"
bright-yellow = "#f6c177"
bright-blue = "#9ccfd8"
bright-magenta = "#c4a7e7"
bright-cyan = "#ea9a97"
bright-white = "#e0def4"

[accents]
primary = "magenta"
secondary = "blue"
tertiary = "green"
