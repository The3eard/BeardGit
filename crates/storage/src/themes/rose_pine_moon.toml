# Rosé Pine Moon.
#
# ANSI mapping note: Rosé Pine has no green and no cyan. Its palette is
# love/gold/rose/pine/foam/iris, and upstream maps `green` to `pine` (a
# teal) and `cyan` to `rose` (a pink). Kept faithful rather than
# substituted, so success and added-line states read teal here by design.

[meta]
id = "rose-pine-moon"
name = "Rosé Pine Moon"
mode = "dark"
complementary = "rose-pine-dawn"

[colors]
background = "#232136"
foreground = "#e0def4"
black = "#393552"
red = "#eb6f92"
green = "#3e8fb0"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ea9a97"
white = "#e0def4"
bright-black = "#6e6a86"
bright-red = "#eb6f92"
bright-green = "#3e8fb0"
bright-yellow = "#f6c177"
bright-blue = "#9ccfd8"
bright-magenta = "#c4a7e7"
bright-cyan = "#ea9a97"
bright-white = "#e0def4"

[accents]
primary = "magenta"
secondary = "blue"
tertiary = "green"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#8c89a3"  # 4.64:1 — blend toward `text`; Rosé Pine has no neutral between `muted` and `subtle` that clears AA
text-muted = "#716e87"  # 3.19:1 — blend
