[meta]
id = "gitlab-dark"
name = "GitLab Dark"
mode = "dark"
complementary = "gitlab-light"

[colors]
background = "#1f1e24"
foreground = "#e1e1e6"
black = "#3b3a44"
red = "#ff6b6b"
green = "#5ddb77"
yellow = "#f0ad4e"
blue = "#428fdc"
magenta = "#c17dff"
cyan = "#40c4aa"
white = "#a4a3aa"
bright-black = "#5e5d66"
bright-red = "#ff8f8f"
bright-green = "#7ee89a"
bright-yellow = "#f5c679"
bright-blue = "#6cb2f7"
bright-magenta = "#d4a4ff"
bright-cyan = "#67d6c1"
bright-white = "#fafafa"

# Palette pins. The derivation guarantees the contrast floors on its own;
# these are kept because the theme's *own* palette has a slot that clears
# them by a wider margin, so pinning is strictly better than blending.
# `[derived]` merges after the derivation, so it wins.
[derived]
text-secondary = "#a4a3aa"  # 6.62:1 — palette `white` (GitLab gray), above the derived 6.05:1.
