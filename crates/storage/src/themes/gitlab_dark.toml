[meta]
id = "gitlab-dark"
name = "GitLab Dark"
mode = "dark"
complementary = "gitlab-light"

[colors]
background = "#1f1e24"
foreground = "#e1e1e6"
black = "#3b3a44"
red = "#ff6b6b"
green = "#5ddb77"
yellow = "#f0ad4e"
blue = "#428fdc"
magenta = "#c17dff"
cyan = "#40c4aa"
white = "#a4a3aa"
bright-black = "#5e5d66"
bright-red = "#ff8f8f"
bright-green = "#7ee89a"
bright-yellow = "#f5c679"
bright-blue = "#6cb2f7"
bright-magenta = "#d4a4ff"
bright-cyan = "#67d6c1"
bright-white = "#fafafa"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#a4a3aa"  # 6.62:1 — palette `white`
text-muted = "#6b6b72"  # 3.13:1 — blend; the palette has no step here
