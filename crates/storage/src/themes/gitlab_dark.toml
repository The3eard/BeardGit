[meta]
id = "gitlab-dark"
name = "GitLab Dark"
mode = "dark"
complementary = "gitlab-light"

[colors]
background = "#1f1e24"
foreground = "#e1e1e6"
black = "#3b3a44"
red = "#ff6b6b"
green = "#5ddb77"
yellow = "#f0ad4e"
blue = "#428fdc"
magenta = "#c17dff"
cyan = "#40c4aa"
white = "#a4a3aa"
bright-black = "#5e5d66"
bright-red = "#ff8f8f"
bright-green = "#7ee89a"
bright-yellow = "#f5c679"
bright-blue = "#6cb2f7"
bright-magenta = "#d4a4ff"
bright-cyan = "#67d6c1"
bright-white = "#fafafa"

# No `[derived]` pins. The palette's `white` (#a4a3aa, GitLab gray) used to
# pin `text-secondary` because it beat the page-only derivation (6.62:1 vs
# 6.05:1) — but that comparison only looked at the page. On `bg-toolbar`,
# where the status bar and tab bar draw secondary text, it measures 4.30:1,
# below WCAG AA, and a pin wins over the derivation that would have fixed
# it. The derived value clears AA on all three surfaces, so the pin is gone.
