# Ayu Light.
# ANSI palette from mbadolato/iTerm2-Color-Schemes (alacritty), the
# canonical 16-colour rendering of the upstream palette.

[meta]
id = "ayu-light"
name = "Ayu Light"
mode = "light"
complementary = "ayu-dark"

[colors]
background = "#f8f9fa"
foreground = "#5c6166"
black = "#000000"
red = "#ea6c6d"
green = "#6cbf43"
yellow = "#eca944"
blue = "#3199e1"
magenta = "#9e75c7"
cyan = "#46ba94"
white = "#bababa"
bright-black = "#686868"
bright-red = "#f07171"
bright-green = "#86b300"
bright-yellow = "#f2ae49"
bright-blue = "#399ee6"
bright-magenta = "#a37acc"
bright-cyan = "#4cbf99"
bright-white = "#d1d1d1"

[accents]
primary = "yellow"
secondary = "blue"
tertiary = "green"
