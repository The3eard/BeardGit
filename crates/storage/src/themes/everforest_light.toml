# Everforest Light (medium contrast).
# ANSI palette from mbadolato/iTerm2-Color-Schemes (alacritty), the
# canonical 16-colour rendering of the upstream palette.

[meta]
id = "everforest-light"
name = "Everforest Light"
mode = "light"
complementary = "everforest-dark"

[colors]
background = "#efebd4"
foreground = "#5c6a72"
black = "#7a8478"
red = "#e67e80"
green = "#9ab373"
yellow = "#c1a266"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#b2af9f"
bright-black = "#a6b0a0"
bright-red = "#f85552"
bright-green = "#8da101"
bright-yellow = "#dfa000"
bright-blue = "#3a94c5"
bright-magenta = "#df69ba"
bright-cyan = "#35a77c"
bright-white = "#fffbef"

[accents]
primary = "green"
secondary = "blue"
tertiary = "yellow"
