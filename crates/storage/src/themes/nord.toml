[meta]
id = "nord"
name = "Nord"
mode = "dark"

[colors]
background = "#2e3440"
foreground = "#d8dee9"
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"
bright-black = "#4c566a"
bright-red = "#bf616a"
bright-green = "#a3be8c"
bright-yellow = "#ebcb8b"
bright-blue = "#81a1c1"
bright-magenta = "#b48ead"
bright-cyan = "#8fbcbb"
bright-white = "#eceff4"

[accents]
primary = "cyan"
secondary = "blue"
tertiary = "magenta"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#969ead"  # 4.63:1 — blend; Nord jumps nord3 → nord4
text-muted = "#78808e"  # 3.14:1 — blend
