[meta]
id = "monokai-pro"
name = "Monokai Pro"
mode = "dark"

[colors]
background = "#2d2a2e"
foreground = "#fcfcfa"
black = "#403e41"
red = "#ff6188"
green = "#a9dc76"
yellow = "#ffd866"
blue = "#78dce8"
magenta = "#ab9df2"
cyan = "#78dce8"
white = "#fcfcfa"
bright-black = "#727072"
bright-red = "#ff6188"
bright-green = "#a9dc76"
bright-yellow = "#ffd866"
bright-blue = "#78dce8"
bright-magenta = "#ab9df2"
bright-cyan = "#78dce8"
bright-white = "#fcfcfa"

[accents]
primary = "magenta"
secondary = "cyan"
tertiary = "yellow"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#949394"  # 4.63:1 — blend; the palette is fg or bright-black, nothing between
text-muted = "#777577"  # 3.10:1 — blend
