[meta]
id = "catppuccin-mocha"
name = "Catppuccin Mocha"
mode = "dark"
complementary = "catppuccin-latte"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#bac2de"
bright-black = "#585b70"
bright-red = "#f38ba8"
bright-green = "#a6e3a1"
bright-yellow = "#f9e2af"
bright-blue = "#89b4fa"
bright-magenta = "#cba6f7"
bright-cyan = "#94e2d5"
bright-white = "#a6adc8"

[accents]
primary = "magenta"
secondary = "blue"
tertiary = "green"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#a6adc8"  # 7.37:1 — palette `bright-white` (Mocha subtext0)
text-muted = "#686b81"  # 3.13:1 — blend
