# Zenburn.
# ANSI palette from mbadolato/iTerm2-Color-Schemes (alacritty), the
# canonical 16-colour rendering of the upstream palette.

[meta]
id = "zenburn"
name = "Zenburn"
mode = "dark"

[colors]
background = "#3f3f3f"
foreground = "#dcdccc"
black = "#4d4d4d"
red = "#7d5d5d"
green = "#60b48a"
yellow = "#f0dfaf"
blue = "#5d6d7d"
magenta = "#dc8cc3"
cyan = "#8cd0d3"
white = "#dcdccc"
bright-black = "#709080"
bright-red = "#dca3a3"
bright-green = "#c3bf9f"
bright-yellow = "#e0cf9f"
bright-blue = "#94bff3"
bright-magenta = "#ec93d3"
bright-cyan = "#93e0e3"
bright-white = "#ffffff"

[accents]
primary = "yellow"
secondary = "green"
tertiary = "blue"
