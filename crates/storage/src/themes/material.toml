# Material (Darker).
# ANSI palette from mbadolato/iTerm2-Color-Schemes (alacritty), the
# canonical 16-colour rendering of the upstream palette.

[meta]
id = "material"
name = "Material"
mode = "dark"

[colors]
background = "#212121"
foreground = "#eeffff"
black = "#000000"
red = "#ff5370"
green = "#c3e88d"
yellow = "#ffcb6b"
blue = "#82aaff"
magenta = "#c792ea"
cyan = "#89ddff"
white = "#ffffff"
bright-black = "#545454"
bright-red = "#ff5370"
bright-green = "#c3e88d"
bright-yellow = "#ffcb6b"
bright-blue = "#82aaff"
bright-magenta = "#c792ea"
bright-cyan = "#89ddff"
bright-white = "#ffffff"

[accents]
primary = "blue"
secondary = "magenta"
tertiary = "green"
