[meta]
id = "catppuccin-latte"
name = "Catppuccin Latte"
mode = "light"
complementary = "catppuccin-mocha"

[colors]
background = "#eff1f5"
foreground = "#4c4f69"
black = "#5c5f77"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#8839ef"
cyan = "#179299"
white = "#acb0be"
bright-black = "#6c6f85"
bright-red = "#d20f39"
bright-green = "#40a02b"
bright-yellow = "#df8e1d"
bright-blue = "#1e66f5"
bright-magenta = "#8839ef"
bright-cyan = "#179299"
bright-white = "#bcc0cc"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#5c5f77"  # 5.53:1 — palette `black` (Latte subtext1)
text-muted = "#6c6f85"  # 4.37:1 — palette `bright-black` (Latte subtext0)
