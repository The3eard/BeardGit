[meta]
id = "dracula"
name = "Dracula"
mode = "dark"

[colors]
background = "#282a36"
foreground = "#f8f8f2"
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#6272a4"
magenta = "#bd93f9"
cyan = "#8be9fd"
white = "#f8f8f2"
bright-black = "#6272a4"
bright-red = "#ff6e6e"
bright-green = "#69ff94"
bright-yellow = "#ffffa5"
bright-blue = "#d6acff"
bright-magenta = "#ff92df"
bright-cyan = "#a4ffff"
bright-white = "#ffffff"

[accents]
primary = "magenta"
secondary = "cyan"
tertiary = "green"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#8692b6"  # 4.61:1 — blend toward `foreground`
text-muted = "#6272a4"  # 3.03:1 — palette `bright-black` (Dracula comment)
