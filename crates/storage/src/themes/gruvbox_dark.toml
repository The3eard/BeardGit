[meta]
id = "gruvbox-dark"
name = "Gruvbox Dark"
mode = "dark"

[colors]
background = "#282828"
foreground = "#ebdbb2"
black = "#3c3836"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright-black = "#504945"
bright-red = "#fb4934"
bright-green = "#b8bb26"
bright-yellow = "#fabd2f"
bright-blue = "#83a598"
bright-magenta = "#d3869b"
bright-cyan = "#8ec07c"
bright-white = "#fbf1c7"

[accents]
primary = "yellow"
secondary = "red"
tertiary = "cyan"

# Accessibility overrides. `text_secondary` derives from `bright-black`,
# which in this palette lands below the WCAG AA floor on the page; raising
# `bright-black` itself would change the terminal's ANSI colours, so the UI
# text tokens are pinned here instead. Audited by
# `test_all_builtin_themes_meet_contrast_floors`.
[derived]
text-secondary = "#a89984"  # 5.30:1 — palette `white` (gruvbox fg4)
text-muted = "#7a7362"  # 3.13:1 — blend
